# Traffic Flow Analyzer Configuration

detector:
  model_name: "yolov8n.pt"  # Pre-trained weights (auto-downloaded) or custom path
  confidence_threshold: 0.40
  iou_threshold: 0.45
  target_classes:
    - 2   # car
    - 3   # motorcycle
    - 5   # bus
    - 7   # truck

tracker:
  max_disappeared_frames: 30
  max_distance_px: 80

counting:
  line_position_ratio: 0.60   # Y position of the counting line relative to frame height (0.0 - 1.0)
  direction_detection: true

speed_estimation:
  enabled: true
  pixels_per_meter: 15.0     # Calibration factor: pixels per real-world meter
  fps: 30.0

road_geometry:
  enabled: true
  pixels_per_meter: 15.0     # Spatial calibration ratio (pixels / meter)
  standard_lane_width_m: 3.5 # Standard highway lane width in meters
  auto_refine_with_vehicles: true
  show_dimension_caliper: true
  caliper_color: [0, 165, 255] # BGR (Orange)

display:
  show_bounding_boxes: true
  show_trajectories: true
  show_hud: true
  line_color: [0, 255, 255]       # BGR (Yellow)
  box_color: [0, 255, 0]          # BGR (Green)

